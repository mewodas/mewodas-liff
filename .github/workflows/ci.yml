name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check + build
        run: npm run build
        env:
          # CI ビルドだけが目的なのでダミー値を渡す
          NOTION_API_KEY: dummy
          GEMINI_API_KEY: dummy
          NEXT_PUBLIC_LIFF_ID: dummy
          ADMIN_SESSION_SECRET: dummy-32-chars-xxxxxxxxxxxxxxxxxx
